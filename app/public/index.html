<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slot confirmations</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    body { margin: 0; }
    header { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); background: var(--bg-surface); border-bottom: 1px solid var(--border-2); }
    header img { height: 28px; }
    header span { color: var(--fg-3); font-size: var(--text-sm); }
    main { max-width: 1040px; margin: 0 auto; padding: var(--space-8) var(--space-4); }
    h3 { margin: 0 0 var(--space-1); }
    .sub { margin: 0 0 var(--space-6); color: var(--fg-3); font-size: var(--text-sm); }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-bottom: var(--space-6); }
    .kpi { background: var(--bg-surface); border: 1px solid var(--border-2); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-4); }
    .kpi small { display: block; }
    .kpi b { font-family: var(--font-mono); font-size: var(--text-2xl); font-weight: 500; }
    .card { background: var(--bg-surface); border: 1px solid var(--border-2); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    th { padding: 12px 18px; text-align: left; font-size: var(--text-2xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); background: var(--bg-page); border-bottom: 1px solid var(--border-2); white-space: nowrap; }
    td { padding: 14px 18px; border-bottom: 1px solid var(--bg-sunken); white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .mono { font-family: var(--font-mono); color: var(--fg-2); }
    .chip { display: inline-block; padding: 2px 10px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: 500; }
    .pending   { background: var(--sun-50);  color: var(--sun-700); }
    .confirmed { background: #E8F6EC;        color: var(--leaf-600); }
    .rejected  { background: #FBEAE4;        color: var(--rust-600); }
    button { display: inline-flex; align-items: center; gap: 6px; font: 500 var(--text-sm) var(--font-sans); padding: 6px 12px; border-radius: var(--radius-md); border: 0; background: var(--bg-brand); color: var(--fg-on-brand); cursor: pointer; }
    button:disabled { background: var(--ink-100); color: var(--fg-4); cursor: not-allowed; }
    button svg { width: 16px; height: 16px; stroke-width: 1.5; }
    .empty { padding: var(--space-8); text-align: center; color: var(--fg-3); }
  </style>
</head>
<body>
  <header>
    <img src="https://cdn.solarsquare.in/blog/wp-content/uploads/2025/11/05101757/logo.webp" alt="SolarSquare">
    <span>AMC cleaning · voice agent</span>
  </header>
  <main>
    <h3>Cleaning slot confirmations</h3>
    <p class="sub">The agent calls each customer to confirm their slot. Statuses update automatically.</p>
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <table>
        <thead><tr><th>Customer</th><th>SSE ID</th><th>Slot</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="empty">Loading bookings…</td></tr></tbody>
      </table>
    </div>
  </main>
  <script>
    const fmtDate = (d) => new Date(d + 'T00:00:00+05:30').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' });
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const LABEL = { pending: 'Pending', confirmed: 'Confirmed', rejected: 'Rejected' };

    async function load() {
      const bookings = await fetch('/api/bookings').then((r) => r.json());
      const count = (s) => bookings.filter((b) => b.status === s).length;
      document.getElementById('kpis').innerHTML = ['pending', 'confirmed', 'rejected']
        .map((s) => `<div class="kpi"><small>${LABEL[s]}</small><b>${count(s)}</b></div>`).join('');
      document.getElementById('rows').innerHTML = bookings.map((b) => `
        <tr>
          <td>${esc(b.customerName)}</td>
          <td class="mono">${esc(b.sseId)}</td>
          <td class="mono">${fmtDate(b.date)} · ${esc(b.window)}</td>
          <td><span class="chip ${b.status}" title="${esc(b.rejectReason ?? '')}">${LABEL[b.status]}</span></td>
          <td><button disabled title="Voice agent not connected yet"><i data-lucide="phone"></i>Call</button></td>
        </tr>`).join('');
      window.lucide?.createIcons();
    }
    load();
    setInterval(load, 3000); // shortcut: polling; switch to SSE when live call transcripts land
  </script>
</body>
</html>
