# Test plan: which settings each stage sweeps, how results are scored, and why the rest are fixed.
# `python -m eval.run check` fails if a setting in agent/config.py has no entry here.
#
# How a stage runs:
#   1. Each arm (an engine setup) runs once as its own baseline.
#   2. One-factor-at-a-time: each sweep value is tried alone on top of that arm (when `when` matches).
#   3. Per setting, the best value wins if it beats the arm's baseline by more than `min_gain`.
#   4. All winners are combined and re-run (settings interact); if the combo is worse than the best
#      single change, winners are added greedily, one at a time, keeping only those that help.
#   5. The best confirmed arm wins the stage; its settings carry into the next stage.

baseline: {}            # overrides on top of agent/config.py defaults (page/.env values are NOT used)

stages:
  stt:
    bench: stt
    conditions: [phone, phone_noisy, phone_babble, real]   # corpus conditions to score on
    min_gain: 1.0
    # score = sum(weight * metric). Accuracy dominates: 1 point = 1% of the call-critical words.
    score:
      entity_acc: 100          # 0..1, words that drive the call (yes/no, day, date, band, ladder, water)
      cer: -20                 # 0..1, script-normalised character error
      empty_rate: -30          # speech that produced no transcript at all
      false_start_rate: -25    # noise heard as speech -> bot cut off mid-sentence (if barge-in is on)
      split_rate: -25          # a thinking pause ended the turn -> bot talks over the customer
      latency_p50: -0.005      # ms; 1000 ms costs 5 points
    gates: {errors_rate: 0.05} # a config with more failed clips than this is disqualified
    arms:
      whisper: {stt_provider: whisper}
    sweep:
      vad_confidence: {values: [0.6, 0.7, 0.8]}
      vad_start_secs: {values: [0.2, 0.4]}
      vad_stop_secs: {values: [0.2, 0.4, 0.6]}
      vad_min_volume: {values: [0.5, 0.6, 0.7]}

  conv:
    bench: conv
    repeats: 2                 # each persona per config; LLM output varies run to run
    min_gain: 2.0
    score:
      pass_rate: 100
      compliance_fails: -20
      llm_p50_ms: -0.005
      llm_cost_inr: -10
    gates: {compliance_fails: 0}
    arms:
      gemini_flash: {llm_provider: google, llm_model: gemini-3.6-flash}
      # add another model to compare head to head, e.g.
      # gemini_flash_lite: {llm_provider: google, llm_model: <model id>}
    sweep:
      llm_temperature: {values: [0.0, 0.3, 0.6]}
      llm_max_tokens: {values: [200, 400, 800]}

# Settings deliberately not swept. A reason is required.
pinned:
  stt_provider: {reason: "Whisper is the only engine; it is the stt stage arm."}
  llm_provider: {reason: "Compared as arms of the conv stage."}
  llm_model: {reason: "Compared as arms of the conv stage; add an arm per model to try."}
  barge_in: {reason: "Decided from the winning stt config: keep on only if false_start_rate <= 0.1, else off. Report states which."}
  tts_provider: {reason: "Needs ears: listening A/B of Piper vs Piper + my voice on real calls, not a metric yet."}
  filler: {reason: "Needs ears on live calls: does a short filler on slow replies sound natural."}
  filler_delay_ms: {reason: "Tune with filler on live calls (CallMetrics latency)."}
  piper_noise_scale: {reason: "Measured once by intelligibility (Whisper CER on Jasir lines): 0.33/0.5 best; re-check after retraining."}
  piper_noise_w: {reason: "Tuned together with piper_noise_scale."}
  piper_voice: {reason: "Needs ears; male Hindi voices only."}
  piper_voice_en: {reason: "Needs ears; male English voices only, used when the customer speaks English."}
  clone_tau: {reason: "Needs ears: how close Piper + my voice sounds to the sample; tune with the /voice page preview."}
  tts_pace: {reason: "Needs ears; about 1.1-1.2 keeps calls snappy."}
  silence_secs: {reason: "Call policy (reprompt after N s); covered by flow scenarios, not a quality knob."}
  turn_stop_timeout: {reason: "Safety fallback; only matters when end-of-speech is lost, which the stt stage already scores."}
  idle_timeout: {reason: "Call policy."}

# Select options a sweep deliberately leaves out.
skip_options:
  llm_provider: {openai: "No OpenAI-compatible key in bot/.env; add an arm when there is one."}

# Provider parameters the bot never sets. `python -m eval.run check` lists any not reviewed here.
# Decide once per parameter: "expose: <how to sweep>" (then add it to agent/config.py and a stage)
# or "ignore: <reason>".
provider_review: {}
