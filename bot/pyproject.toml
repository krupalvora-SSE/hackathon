[project]
name = "visit-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "indic-transliteration>=2.3",
    "pipecat-ai[google,openai,piper,runner,sarvam,silero,webrtc]>=1.17.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Local Whisper STT, no account or credits needed: faster-whisper (any CPU) + MLX (Apple Silicon GPU)
whisper = [
    "pipecat-ai[whisper]>=1.17.0",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
indic = [
    "huggingface-hub>=2.4.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.20.1",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "transformers>=5.24.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
