# Intents the LLM classifies each customer turn into.
# ---------------------------------------------------
# scope: global -> works in every conversation state (unless the state disables it)
#                  and jumps to `goto`. `goto: $stay` answers and stays in the state.
# scope: local  -> only meaningful where a state's transition uses it as `on:`.
# `entities` are extracted alongside the intent and stored in call context.
# Examples are seed phrases for the classifier prompt and for test calls; extend
# them from real call recordings.

global:

  not_serviceable:
    label: Not available / site not ready
    goto: SITE_ON_HOLD
    entities: [hold_reason, hold_until]
    examples:
      hi: ["mai abhi gaon gaya hua hoon", "hum shift ho rahe hain", "chhat pe kaam chal raha hai", "do mahine bahar hoon"]
      en: ["I'm out of town", "we are moving house", "roof repair is going on"]

  call_later:
    label: Busy, call later
    goto: RECALL
    entities: [recall_window]
    examples:
      hi: ["abhi busy hoon, baad mai call karo", "meeting mai hoon", "shaam ko phone karna"]
      en: ["I'm busy, call me later", "call me in the evening"]

  wants_human:
    label: Wants a person
    goto: ESCALATE_RM
    set: {rm_callback_reason: customer_asked_for_human}
    examples:
      hi: ["kisi insaan se baat karao", "senior se baat karni hai", "manager ko do"]
      en: ["let me talk to a person", "connect me to your senior"]

  do_not_call:
    label: Don't call me
    goto: DNC_CLOSE
    examples:
      hi: ["call mat karo", "pareshan mat karo", "DND pe daalo", "band karo yeh calls"]
      en: ["don't call me again", "stop calling", "unsubscribe me"]

  wrong_person:
    label: Someone else answered
    goto: WRONG_PERSON
    examples:
      hi: ["mai unka beta bol raha hoon", "wo ghar pe nahi hain", "galat number hai"]
      en: ["this is his son", "she's not here", "wrong number"]

  missed_visit_complaint:
    label: Nobody came last time
    goto: MISSED_VISIT
    entities: [issue]
    examples:
      hi: ["pichle mahine bhi koi nahi aaya", "ek hafta ho gaya koi nahi aaya", "kal bhi time diya tha, koi nahi aaya", "roz yahi kahani sunate ho"]
      en: ["nobody came last month", "you gave me a time last week and nobody came"]

  frustrated:
    label: Upset or other complaint
    goto: FRUSTRATED
    entities: [issue, reason]
    examples:
      hi: ["bill galat aaya hai", "subsidy abhi tak nahi mili", "aapki service bekaar hai", "baar baar phone kyun karte ho", "main bahut pareshan hoon"]
      en: ["I have a complaint", "your service is terrible", "you keep calling me"]

  off_script:
    label: Something outside this call
    goto: ESCALATE_RM
    set: {rm_callback_reason: off_script}
    entities: [issue]
    examples:
      hi: ["naya panel lagwana hai", "loan ke baare mai poochna tha", "refund chahiye", "mere dost ke ghar bhi lagwana hai", "system shift karna hai"]
      en: ["I want to add more panels", "I need a refund", "can you help with my loan"]

  abusive:
    label: Abusive
    goto: ESCALATE_RM
    set: {rm_callback_reason: abusive}
    examples:
      hi: ["(gaali)", "dimaag kharab mat karo, bewakoof"]
      en: ["(abuse)", "shut up, you idiot"]

  cant_hear:
    label: Can't hear the bot
    goto: $stay
    say: can_you_hear
    then_repeat: false
    escalate_after: 1              # second time in a row -> end and call back
    escalate_to: LINE_ISSUE_CLOSE
    examples:
      hi: ["hello? hello?", "awaaz nahi aa rahi", "kuch sunai nahi de raha"]
      en: ["hello? can you hear me?", "I can't hear you"]

  change_language:
    label: Wants another language
    goto: $stay
    say: language_switched         # the next lines come in the new language; other languages get only_hi_en
    entities: [language]
    examples:
      hi: ["English mein boliye", "Hindi mein baat karo", "Marathi mein bolo"]
      en: ["please speak in English", "can you speak Hindi"]

  site_issue:
    label: Mentions a problem at the site
    goto: $stay
    say: site_issue_noted
    entities: [issue]
    examples:
      hi: ["ek panel toot gaya hai", "inverter mai error aa raha hai", "generation kam ho raha hai", "chhat se paani tapakta hai", "panel pe chidiya ka ghonsla hai"]
      en: ["one panel is cracked", "the inverter shows an error"]

  visit_question:
    label: Asks what the visit involves
    goto: $stay
    say: visit_info
    examples:
      hi: ["visit mai kya karoge", "kitna time lagega"]
      en: ["what will you do in the visit", "how long will it take"]

  what_is_service:
    label: Asks what this service is
    goto: $stay
    say: service_info
    examples:
      hi: ["ye kaun si service hai", "maine to koi service book nahi ki", "ye kis cheez ki visit hai", "AMC kya hota hai"]
      en: ["what service is this", "I didn't book any service", "what is this visit for"]

  why_so_early:
    label: Asks why the visit is so soon
    # A question, not a refusal: answer and repeat the offer. First PM gets the commissioning reason.
    goto: $stay
    say: why_early
    say_if: {context: first_pm, key: why_early_first_pm}
    examples:
      hi: ["itni jaldi kyun", "abhi to lagaya hai, abhi se service kyun", "abhi kyun aana hai"]
      en: ["why so early", "it was just installed, why a service already", "why now"]

  someone_home:
    label: Asks if someone must be home
    goto: $stay
    say: someone_home
    examples:
      hi: ["ghar pe kisi ka hona zaroori hai", "main office mai hounga"]
      en: ["does someone need to be home"]

  not_needed_now:
    label: Not needed yet
    goto: NOT_NEEDED
    examples:
      hi: ["abhi to plan naya hai, zaroorat nahi", "panel abhi saaf hain", "abhi 2 din hi hue hain", "baad mai karwa lenge"]
      en: ["the plan just started, no need yet", "the panels are clean already"]

  outside_service_hours:
    shares_time: true
    label: Wants a time outside 9 am to 6 pm
    goto: $stay
    say: service_hours
    examples:
      hi: ["9 baje se pehle aa sakte ho?", "subah 8 baje", "shaam 7 baje ke baad", "raat ko aao"]
      en: ["can they come before 9?", "after 7 in the evening"]

  unclear:
    label: Not clear
    goto: $stay
    say: didnt_catch
    escalate_after: 2              # this many unclear turns in a row on one step...
    escalate_to: ESCALATE_RM       # ...then hand over (reason: repeated_misunderstanding)
    examples:
      hi: ["hmm", "(noise)", "(answer unrelated to the question)"]
      en: ["(noise)", "(answer unrelated to the question)"]

  repeat_request:
    label: Asks to repeat
    goto: $stay
    say: repeat_lead               # fallback; each question has its own short form (repeat_<key> in prompts)
    examples:
      hi: ["phir se boliye", "kya bola", "kya kaha aapne", "dobara bolo", "ek baar aur bolna", "samjha nahi, repeat karo", "kya?"]
      en: ["sorry, what?", "can you repeat that", "say that again", "I didn't get that"]

  wait_a_moment:
    label: Asks us to hold on
    goto: $stay
    say: hold_ack                  # spoken alone: the question is not repeated; silence waits policies.silence.hold_s
    examples:
      hi: ["ek minute ruko", "ek second", "ruko zara", "hold karo", "abhi aata hoon", "ek minute line pe rahiye"]
      en: ["hold on", "one minute please", "just a second", "give me a moment"]

  who_are_you:
    label: Asks who is calling
    goto: $stay
    say: identity_who
    examples:
      hi: ["kaun bol raha hai", "aap kaun ho", "kahan se bol rahe ho", "kis company se ho"]
      en: ["who is this", "who are you", "which company is this"]

  number_source:
    label: Asks where we got the number
    goto: $stay
    say: identity_source
    examples:
      hi: ["mera number kahan se mila", "ye number kisne diya", "mera number aapke paas kaise aaya"]
      en: ["where did you get my number", "how did you get this number"]

  is_robot:
    label: Asks if it is a machine
    goto: $stay
    say: identity_robot            # must admit it is an AI assistant
    examples:
      hi: ["aap robot ho", "machine bol rahi hai kya", "insaan ho ya computer", "kya ye AI hai"]
      en: ["are you a robot", "am I talking to a machine", "is this an AI"]

  price_or_offtopic:
    label: Asks about price
    # The visit is always included in the AMC plan. Never quote any other price.
    goto: $stay
    say: price_included
    examples:
      hi: ["kitna charge lagega", "paise lagenge kya", "free hai na"]
      en: ["how much will it cost", "is it free"]

local:

  affirm:
    label: Yes
    examples:
      hi: ["haan", "ji haan", "theek hai", "chalega", "ho jayega", "sab ready hai"]
      en: ["yes", "okay", "that works", "everything is ready"]

  deny:
    label: No
    examples:
      hi: ["nahi", "us din nahi ho payega", "ladder nahi hai", "nahi chalega"]
      en: ["no", "I'm not available that day", "we don't have a ladder"]

  ask_time:
    shares_time: true
    label: Asks the time
    examples:
      hi: ["kitne baje aayenge", "time kya hoga", "subah aayenge ya shaam ko"]
      en: ["what time will they come", "morning or evening?"]

  wants_exact_time:
    shares_time: true
    label: Wants exact time
    entities: [preferred_exact_time]
    examples:
      hi: ["exact time batao", "theek 10 baje aana", "mujhe fix time chahiye"]
      en: ["I need an exact time", "come at 10 sharp"]

  wants_other_band:
    shares_time: true
    label: Wants another time
    entities: [preferred_band]
    examples:
      hi: ["subah nahi, shaam ko aa sakte ho", "dopahar mai bhejo"]
      en: ["not morning, can they come in the evening", "afternoon works better"]

  household_member:
    label: Family member, can decide
    examples:
      hi: ["mai unki wife hoon, mujhe bata do", "haan ghar ka hi hoon, bolo"]
      en: ["I'm his wife, you can tell me", "I live here, go ahead"]

  customer_unavailable:
    label: Customer not home
    examples:
      hi: ["wo abhi nahi hain, baad mai call karo", "mere bete se baat karna"]
      en: ["he isn't here, call later", "talk to my son"]

  proposes_date:
    label: Suggests their own date
    entities: [date, band]
    examples:
      hi: ["25 tareekh ko aa jao", "agle Sunday rakh do", "is date pe nahi, 10 ko aana"]
      en: ["can you come on the 25th instead", "make it next Sunday"]

  gives_band:
    label: Picks a time of day
    entities: [band]
    examples:
      hi: ["subah", "dopahar mai", "shaam ko"]
      en: ["morning", "afternoon", "evening"]

  not_required:
    label: Not needed here
    entities: [reason]
    examples:
      hi: ["seedhi nahi hai par chhat pe seedhiyan hain", "ladder ki zaroorat nahi, panel neeche shed pe hain"]
      en: ["no ladder, but there are stairs to the roof", "not needed, the panels are on a low shed"]

  date_given:
    label: Gives a date
    entities: [hold_until]
    examples:
      hi: ["agle hafte tak ho jayega", "15 tareekh ke baad", "Diwali ke baad"]
      en: ["by next week", "after the 15th"]

  time_range_given:
    label: Gives a time
    entities: [recall_window]
    examples:
      hi: ["kal shaam 5 se 7", "do ghante baad", "Sunday subah"]
      en: ["tomorrow 5 to 7 pm", "in two hours"]

  change_date:
    label: Change day
    examples:
      hi: ["date badalni hai", "us din nahi, koi aur din"]
      en: ["can we change the date", "a different day"]

  change_time:
    label: Change time
    examples:
      hi: ["time badal do", "shaam ka kar do"]
      en: ["change the time", "make it evening"]
