# Service Scheduling call flow (Beat Plan driven)
# ------------------------------------------------
# The bot's state machine. Code runs this file; the LLM only classifies what the
# customer said into an intent (see intents.yaml) and speaks the state's line
# (see prompts/<lang>.yaml). Edit, then run:  python tools/flowcheck.py --write
#
# Transition rules
#   - Transitions are checked top to bottom; the first whose `on` matches and
#     whose `when` flag holds wins. `when: "!flag"` means the flag is false.
#   - Flags are set by code (counters, policy values, action results), never by the LLM.
#   - `say:` plays a specific prompt key of the target state instead of its `main` line.
#   - `tone: <name>` on a state: how the bot sounds there (policies.tones), overriding the customer's mood.
#   - `prefix_if: {context: <flag>, key: <prompt key>}`: speak that line first when the Beat Plan context
#     flag is true (once per call).
#   - `main_if: {context: <flag>, key: <prompt key>}`: speak that line instead of `main` when the Beat Plan
#     context flag is true (e.g. first_pm: the first maintenance visit after commissioning).
#   - Global intents can use `say_if` the same way to pick a different `_global` line.
#   - `time_line: <key>` on a state: use that prompt key instead of `main` once the customer has asked
#     about time (intents with `shares_time: true`). Otherwise the bot never mentions a time window,
#     which keeps the team free to move the slot within the day.
#   - `set:` stores values in call context (e.g. which slot the customer picked).
#   - Global intents (intents.yaml, scope: global) work in every `conversation`
#     state unless the state lists them in `disable_global`.
#
# State types
#   conversation : bot speaks, waits for the customer
#   system       : bot runs actions and moves on from their result events
#   terminal     : bot says goodbye, hangs up; POST_CALL then always runs

flow_id: service_scheduling
version: 0.10.0
title: Service scheduling call flow
ticket: SSE-15539
summary: How the AI voice bot turns a Beat Plan soft slot into a confirmed visit, a site on hold, or a callback.
start: PRE_CALL

# Sections group states by job, for the README diagrams only (the engine ignores them).
# Every state belongs to exactly one section.
sections:
  start:
    title: 1. Start the call
    about: Check the customer can be called, say hello and make sure we're talking to the right person.
    states: [PRE_CALL, GREET, NOT_DIALLED, VOICEMAIL_CLOSE]
  slot:
    title: 2. Find another date or time
    about: When the planned date or time doesn't suit, or the customer pushes back, find one that does.
    states: [OFFER_PRIMARY, MISSED_VISIT, TIME_BAND, CHECK_BAND, ALTERNATE_DAYS, NOT_NEEDED, ASK_BAND_FOR_DATE, NO_SLOT_CLOSE, NOT_NEEDED_CLOSE, REQUEST_CLOSE]
  confirm:
    title: 3. Check readiness and book
    about: Make sure the ladder, water and light are ready, repeat the details and book the visit.
    states: [READINESS_CHECK, RECAP, BOOK, CONFIRMED_CLOSE, MANUAL_CONFIRM_CLOSE]
  hold:
    title: 4. Pause the site
    about: If the site isn't ready, get a date and the customer's OK to stop calls until then.
    states: [ASK_READY_DATE, FIND_SLOT_AFTER_READY, SITE_ON_HOLD, HOLD_CONSENT, APPLY_HOLD, HOLD_CLOSE, HOLD_DECLINED_CLOSE]
  later:
    title: 5. Call back or hand over
    about: The customer is busy or wants a person. Note when to call back, or ask a senior to call.
    states: [RECALL, APPLY_RECALL, RECALL_CLOSE, ESCALATE_RM, RM_CLOSE, FRUSTRATED, AFTER_TICKET, TICKET_CLOSE]
  anytime:
    title: 6. Can happen any time
    about: Someone else answers, the customer asks us not to call or record, bad news, or nobody replies.
    states: [WRONG_PERSON, WRONG_NUMBER_CLOSE, DNC_CLOSE, NO_ANSWER_CLOSE, LINE_ISSUE_CLOSE, RECORDING_STOP_CLOSE, SENSITIVE_CLOSE, HUNG_UP_CLOSE]

# Plain-English labels for diagram arrows (events and guard flags).
labels:
  context_ready: OK to call
  not_eligible: Can't call now
  context_failed: Beat Plan didn't load
  caller_hangup: Customer hung up
  voicemail_detected: Voicemail answered
  silence_timeout: No reply
  action_ok: Done
  action_failed: System error
  band_available: Free
  band_full: Full
  no_backup_slots: No other days
  slot_found: Found one
  none_found: None free
  exact_time_limit_reached: {when_true: asks again, when_false: first time}
  options_remaining: {when_true: more days to offer, when_false: no more days}
  reschedule_after_ready_date: {when_true: if rebooking is on, when_false: default}
  date_is_free: {when_true: Beat Plan has that day, when_false: not in Beat Plan}
  band_given: {when_true: time of day given too, when_false: no time of day}
  hold_too_long: {when_true: more than max_hold_days away, when_false: within the limit}
  ticket_failed: {when_true: ticket wasn't created, when_false: ticket created}

# Example values for {placeholders}, so the shareable page shows a real-sounding line.
sample_values:
  hi: {name: राहुल, bot_name: Krupal, weekday: शनिवार, date_spoken: 28 नवंबर, band_spoken: सुबह आठ से बारह बजे,
       options_spoken: "सोमवार, 30 नवंबर, सुबह या बुधवार, 2 दिसंबर, शाम", missing_item: A-type ladder,
       hold_until_spoken: 5 दिसंबर, recall_window_spoken: कल शाम 5 से 7 बजे,
       requested_date_spoken: "गुरुवार, 10 दिसंबर", requested_band_spoken: सुबह, sms_line: "", support_line: " हमारी helpline नौ आठ तीन शून्य शून्य, शून्य तीन शून्य शून्य शून्य पर", support_number_spoken: "नौ आठ तीन शून्य शून्य, शून्य तीन शून्य शून्य शून्य", visit_duration_spoken: ", लगभग 45 मिनट लगते हैं"}
  en: {name: Rahul, bot_name: Krupal, weekday: Saturday, date_spoken: 28 November, band_spoken: 8 am and 12 pm,
       options_spoken: "Monday, 30 November, morning or Wednesday, 2 December, evening", missing_item: A-type ladder,
       hold_until_spoken: 5 December, recall_window_spoken: tomorrow 5 to 7 pm,
       requested_date_spoken: "Thursday, 10 December", requested_band_spoken: morning, sms_line: "", support_line: " our helpline on nine eight three zero zero, zero three zero zero zero", support_number_spoken: "nine eight three zero zero, zero three zero zero zero", visit_duration_spoken: ". It takes about 45 minutes"}

# Events raised by code (timers, action results), not by the customer.
events:
  - context_ready
  - not_eligible
  - context_failed
  - silence_timeout
  - caller_hangup
  - voicemail_detected
  - action_ok
  - action_failed
  - band_available
  - band_full
  - no_backup_slots
  - slot_found
  - none_found

# Flags code computes before choosing a guarded transition.
flags:
  exact_time_limit_reached: "exact_time_asks (including this one) > policies.exact_time_insist_limit"
  options_remaining: "unoffered backup slots exist"
  reschedule_after_ready_date: "policies.on_missing_prereq == 'reschedule_after_ready_date'"
  date_is_free: "the date the customer suggested is the planned date or a Beat Plan backup day"
  band_given: "the customer said a time of day together with their own date (e.g. 'kal afternoon')"
  hold_too_long: "the hold/ready date is more than policies.site_on_hold.max_hold_days away"
  ticket_failed: "create_support_ticket returned action_failed in this call"

# Applies to every conversation state.
global_events:
  - on: silence_timeout
    to: NO_ANSWER_CLOSE
  - on: caller_hangup            # line dropped mid-call: partial record, flagged for review
    to: HUNG_UP_CLOSE
  - on: voicemail_detected       # answering machine / caller tune: don't talk to it
    to: VOICEMAIL_CLOSE

outcomes:
  - slot_confirmed
  - slot_confirmed_alt_band
  - slot_confirmed_alt_day
  - site_on_hold
  - hold_declined
  - no_slot_available
  - rm_callback
  - recall_requested
  - do_not_call
  - wrong_number
  - no_answer
  - needs_manual_confirmation
  - not_dialled
  - not_needed_now
  - date_requested
  - support_ticket
  - line_issue
  - recording_declined
  - sensitive_situation
  - hung_up

# Runs after every terminal state, whatever the outcome.
post_call:
  actions: [summarise_call, post_beatplan_comment]

states:

  PRE_CALL:
    title: Check before calling
    type: system
    actions: [fetch_beatplan_context, check_call_eligibility]
    transitions:
      - on: context_ready
        to: GREET
      - on: not_eligible
        to: NOT_DIALLED
      - on: context_failed               # Beat Plan returned no usable slot/customer: never dial with blanks
        to: NOT_DIALLED
      - on: action_failed                # Beat Plan down or timed out
        to: NOT_DIALLED
        set: {blocked_reason: beatplan_unavailable}

  GREET:
    title: Say hello, check it's the customer
    type: conversation
    collects: [identity_confirmed]
    transitions:
      - on: affirm
        to: OFFER_PRIMARY
        set: {spoke_to: customer}

  WRONG_PERSON:
    title: Someone else answered
    type: conversation
    transitions:
      - on: household_member
        to: OFFER_PRIMARY
        set: {spoke_to: family_member}
      - on: customer_unavailable
        to: RECALL
      - on: not_decision_maker           # child, staff, tenant: never book through them
        to: RECALL
        say: when_customer_home
        set: {spoke_to: other}
      - on: deny
        to: WRONG_NUMBER_CLOSE

  OFFER_PRIMARY:
    title: Offer the planned date
    type: conversation
    # If Beat Plan says the last visit was missed, apologise for it first (once).
    prefix_if: {context: last_visit_missed, key: missed_visit}
    # First PM (Beat Plan first_pm): say it's the first check-up after commissioning, included in the plan.
    main_if: {context: first_pm, key: first_pm}
    transitions:
      - on: affirm
        to: READINESS_CHECK
        set: {selected_slot: primary_slot, slot_source: primary}
      - on: ask_time
        to: TIME_BAND
      - on: deny
        to: ALTERNATE_DAYS
      - on: proposes_date
        when: date_is_free
        to: READINESS_CHECK
        set: {slot_source: alt_day}
      - on: proposes_date
        when: band_given
        to: REQUEST_CLOSE
      - on: proposes_date
        to: ASK_BAND_FOR_DATE

  TIME_BAND:
    title: Tell the time window
    type: conversation
    collects: [preferred_exact_time]
    transitions:
      - on: affirm
        to: READINESS_CHECK
        set: {selected_slot: primary_slot, slot_source: primary}
      - on: wants_exact_time
        when: "!exact_time_limit_reached"
        to: TIME_BAND
        say: no_exact_guarantee
      - on: wants_exact_time
        when: exact_time_limit_reached
        to: ESCALATE_RM
        set: {rm_callback_reason: insists_on_exact_time}
      - on: wants_other_band
        to: CHECK_BAND
      - on: deny
        to: ALTERNATE_DAYS

  CHECK_BAND:
    title: Check another time that day
    type: system
    actions: [check_band_availability]
    transitions:
      - on: band_available
        to: READINESS_CHECK
        set: {slot_source: alt_band}
      - on: band_full
        to: ALTERNATE_DAYS
        say: band_full

  ALTERNATE_DAYS:
    title: Offer other days
    type: conversation
    actions: [get_backup_slots]          # sorted closest-first, offered max_options_per_turn at a time
    transitions:
      - on: no_backup_slots
        to: NO_SLOT_CLOSE
      - on: affirm
        to: READINESS_CHECK
        set: {slot_source: alt_day}
      - on: wants_other_band
        to: CHECK_BAND
      - on: proposes_date
        when: date_is_free
        to: READINESS_CHECK
        set: {slot_source: alt_day}
      - on: proposes_date
        when: band_given
        to: REQUEST_CLOSE
      - on: proposes_date
        to: ASK_BAND_FOR_DATE
      - on: deny
        when: options_remaining
        to: ALTERNATE_DAYS
        say: next_options
      - on: deny
        when: "!options_remaining"
        to: NO_SLOT_CLOSE

  NOT_NEEDED:
    title: Explain why the visit helps now
    type: conversation
    # Entered from the global not_needed_now intent ("plan is new", "panels are clean"). One try only.
    disable_global: [not_needed_now]
    main_if: {context: first_pm, key: first_pm}
    transitions:
      - on: affirm
        to: READINESS_CHECK
        set: {selected_slot: primary_slot, slot_source: primary}
      - on: ask_time
        to: TIME_BAND
      - on: deny
        to: NOT_NEEDED_CLOSE

  ASK_BAND_FOR_DATE:
    title: Ask the time for their date
    type: conversation
    collects: [requested_band]
    transitions:
      - on: gives_band
        to: REQUEST_CLOSE

  READINESS_CHECK:
    title: "Ask: ladder, water, light ready?"
    type: conversation
    # Asks every policies.readiness_items entry one at a time (prompt key ask_<id>).
    # `affirm` fires once all are yes; `deny` fires after the last answer if any was no.
    checklist: readiness_items
    collects: [readiness]
    transitions:
      - on: affirm
        to: RECAP
      - on: deny
        to: ASK_READY_DATE
        set: {hold_reason: prerequisites_missing}
      - on: not_required            # e.g. "no ladder, but there are stairs to the roof": counts as ready
        to: RECAP

  ASK_READY_DATE:
    title: Ask when it will be ready
    type: conversation
    collects: [hold_until]
    transitions:
      - on: date_given
        when: hold_too_long
        to: ESCALATE_RM
        set: {rm_callback_reason: hold_too_long}
      - on: date_given
        when: reschedule_after_ready_date
        to: FIND_SLOT_AFTER_READY
      - on: date_given
        when: "!reschedule_after_ready_date"
        to: HOLD_CONSENT

  FIND_SLOT_AFTER_READY:
    title: Find a free day after that
    type: system
    actions: [get_backup_slots]          # filtered to dates after hold_until
    transitions:
      - on: slot_found
        to: RECAP
        set: {slot_source: alt_day}
      - on: none_found
        to: HOLD_CONSENT

  RECAP:
    time_line: with_time    # say the time window only if the customer asked about time
    title: Repeat the details, get a yes
    type: conversation
    transitions:
      - on: affirm
        to: BOOK
      - on: change_date
        to: ALTERNATE_DAYS
      - on: change_time
        to: TIME_BAND
      - on: deny                         # plain "nahi, abhi nahi": offer other days instead of guessing
        to: ALTERNATE_DAYS
      - on: readiness_changed            # "actually ladder nahi hai": treat like a missing item
        to: ASK_READY_DATE
        set: {hold_reason: prerequisites_missing}

  BOOK:
    title: Book the visit
    type: system
    actions: [confirm_slot]
    transitions:
      - on: action_ok
        to: CONFIRMED_CLOSE
      - on: action_failed
        to: MANUAL_CONFIRM_CLOSE

  SITE_ON_HOLD:
    title: Ask when we can come
    type: conversation
    # Entered from the global not_serviceable intent (out of town, roof repair...).
    collects: [hold_reason, hold_until]
    disable_global: [not_serviceable]
    transitions:
      - on: date_given
        when: hold_too_long
        to: ESCALATE_RM
        set: {rm_callback_reason: hold_too_long}
      - on: date_given
        to: HOLD_CONSENT

  HOLD_CONSENT:
    title: Ask OK to pause calls
    type: conversation
    disable_global: [not_serviceable]
    transitions:
      - on: affirm
        to: APPLY_HOLD
        set: {hold_consent: true}
      - on: deny
        to: HOLD_DECLINED_CLOSE
        set: {hold_consent: false}

  APPLY_HOLD:
    title: Pause the site
    type: system
    actions: [site_on_hold]
    transitions:
      - on: action_ok
        to: HOLD_CLOSE
      - on: action_failed
        to: MANUAL_CONFIRM_CLOSE

  RECALL:
    title: Ask when to call back
    type: conversation
    collects: [recall_window]
    disable_global: [call_later]
    transitions:
      - on: time_range_given
        to: APPLY_RECALL

  APPLY_RECALL:
    title: Note the call-back time
    type: system
    actions: [schedule_recall]
    transitions:
      - on: action_ok
        to: RECALL_CLOSE
      - on: action_failed
        to: RECALL_CLOSE

  ESCALATE_RM:
    title: Arrange a supervisor call
    type: system
    actions: [create_rm_callback]
    transitions:
      - on: action_ok
        to: RM_CLOSE
      - on: action_failed
        to: RM_CLOSE

  MISSED_VISIT:
    title: Apologise for the missed visit, offer the date
    type: conversation
    tone: empathetic
    # "Nobody came last month / week": still worth booking. Own the miss, then pitch the planned date.
    disable_global: [missed_visit_complaint]
    transitions:
      - on: affirm
        to: READINESS_CHECK
        set: {selected_slot: primary_slot, slot_source: primary}
      - on: ask_time
        to: TIME_BAND
      - on: deny
        to: ALTERNATE_DAYS

  FRUSTRATED:
    title: Apologise, raise a ticket, give the helpline
    type: conversation
    tone: empathetic
    # Other complaints (billing, subsidy, service): stop the script, apologise once, raise a ticket,
    # read out the helpline slowly and check it was noted.
    actions: [create_support_ticket]
    disable_global: [frustrated, missed_visit_complaint]
    transitions:
      - on: action_failed                # ticket not created: never claim it was
        to: AFTER_TICKET
        say: ticket_failed
        set: {ticket_failed: true, needs_review: true}
      - on: affirm
        to: AFTER_TICKET
      - on: deny
        to: AFTER_TICKET
        say: number_again

  AFTER_TICKET:
    title: Offer to fix the visit meanwhile
    type: conversation
    tone: slow_clear
    disable_global: [frustrated, missed_visit_complaint]
    transitions:
      - on: affirm
        to: OFFER_PRIMARY
      - on: deny
        when: ticket_failed              # no ticket exists: a supervisor calls instead
        to: ESCALATE_RM
        set: {rm_callback_reason: support_ticket_failed}
      - on: deny
        to: TICKET_CLOSE

  # ---------- terminal states (each ends the call with one outcome) ----------

  CONFIRMED_CLOSE:
    title: Visit booked
    type: terminal
    time_line: with_time    # say the time window only if the customer asked about time
    outcome_from: slot_source
    outcome_map:
      primary: slot_confirmed
      alt_band: slot_confirmed_alt_band
      alt_day: slot_confirmed_alt_day

  HOLD_CLOSE:
    title: Site paused
    type: terminal
    outcome: site_on_hold

  HOLD_DECLINED_CLOSE:
    title: Customer said no to pausing
    type: terminal
    outcome: hold_declined

  NO_SLOT_CLOSE:
    title: No free slot
    type: terminal
    outcome: no_slot_available

  RM_CLOSE:
    title: Supervisor will call
    type: terminal
    outcome: rm_callback

  RECALL_CLOSE:
    title: We'll call back
    type: terminal
    outcome: recall_requested

  DNC_CLOSE:
    title: Won't call again
    type: terminal
    actions: [mark_dnc]
    outcome: do_not_call

  WRONG_NUMBER_CLOSE:
    title: Wrong number
    type: terminal
    outcome: wrong_number

  NO_ANSWER_CLOSE:
    title: No answer
    type: terminal
    outcome: no_answer

  MANUAL_CONFIRM_CLOSE:
    title: Team will confirm
    type: terminal
    actions: [create_rm_callback]
    outcome: needs_manual_confirmation

  NOT_NEEDED_CLOSE:
    title: Not needed yet, call later
    type: terminal
    outcome: not_needed_now

  REQUEST_CLOSE:
    title: Date request noted
    type: terminal
    actions: [request_date]
    outcome: date_requested

  TICKET_CLOSE:
    title: Support ticket raised
    type: terminal
    tone: slow_clear
    outcome: support_ticket

  LINE_ISSUE_CLOSE:
    title: Can't hear, call back
    type: terminal
    actions: [schedule_recall]
    outcome: line_issue

  NOT_DIALLED:
    title: Not called
    type: terminal
    silent: true                         # call never placed; still logged to Beat Plan
    outcome: not_dialled

  RECORDING_STOP_CLOSE:
    title: Customer objects to recording
    type: terminal
    actions: [create_rm_callback]        # a person calls back without recording; not a DNC
    outcome: recording_declined

  SENSITIVE_CLOSE:
    title: Bereavement or illness
    type: terminal
    tone: empathetic
    actions: [create_rm_callback]
    outcome: sensitive_situation

  HUNG_UP_CLOSE:
    title: Customer hung up
    type: terminal
    silent: true
    outcome: hung_up

  VOICEMAIL_CLOSE:
    title: Voicemail answered
    type: terminal
    silent: true
    outcome: no_answer
