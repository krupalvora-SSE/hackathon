# Service Scheduling call flow (Beat Plan driven)
# ------------------------------------------------
# The bot's state machine. Code runs this file; the LLM only classifies what the
# customer said into an intent (see intents.yaml) and speaks the state's line
# (see prompts/<lang>.yaml). Edit, then run:  python tools/flowcheck.py --write
#
# Transition rules
#   - Transitions are checked top to bottom; the first whose `on` matches and
#     whose `when` flag holds wins. `when: "!flag"` means the flag is false.
#   - Flags are set by code (counters, policy values, action results), never by the LLM.
#   - `say:` plays a specific prompt key of the target state instead of its `main` line.
#   - `time_line: <key>` on a state: use that prompt key instead of `main` once a time was talked about
#     (intents with `shares_time: true`, or a state with `shares_time: true` such as ASK_SLOT).
#   - `shares_time: true` on a state: entering it counts as talking about time, so the read-back and
#     "visit booked" lines say the time window from then on.
#   - `set:` stores values in call context (e.g. which slot the customer picked).
#   - Global intents (intents.yaml, scope: global) work in every `conversation`
#     state unless the state lists them in `disable_global`.
#
# State types
#   conversation : bot speaks, waits for the customer
#   system       : bot runs actions and moves on from their result events
#   terminal     : bot says goodbye, hangs up; POST_CALL then always runs

flow_id: service_scheduling
version: 0.26.1
title: Service scheduling call flow
ticket: SSE-15559
summary: How the AI voice bot turns a Beat Plan soft slot into a confirmed visit, a site on hold, or a callback.
start: PRE_CALL

# Sections group states by job, for the README diagrams only (the engine ignores them).
# Every state belongs to exactly one section.
sections:
  start:
    title: 1. Start the call
    about: Check the customer can be called, say hello and make sure we're talking to the right person.
    states: [PRE_CALL, GREET, NOT_DIALLED]
  slot:
    title: 2. Find another date or time
    about: When the planned date or time doesn't suit, or the customer pushes back, find one that does.
    states: [OFFER_PRIMARY, ASK_SLOT, CHECK_SLOT, TIME_BAND, CHECK_BAND, ALTERNATE_DAYS, ASK_OWN_DATE, NOT_NEEDED, ASK_BAND_FOR_DATE, NO_SLOT_CLOSE, NOT_NEEDED_CLOSE, REQUEST_CLOSE]
  confirm:
    title: 3. Check readiness and book
    about: Make sure the ladder, water and light are ready, repeat the details, ask about any issue on the site and book the visit.
    states: [READINESS_CHECK, RECAP, RECAP_CHANGE, SITE_ISSUES, ISSUE_DETAILS, BOOK, CONFIRMED_CLOSE, MANUAL_CONFIRM_CLOSE]
  hold:
    title: 4. Pause the site
    about: If the site isn't ready, get a date and the customer's OK to stop calls until then.
    states: [ASK_READY_DATE, FIND_SLOT_AFTER_READY, SITE_ON_HOLD, HOLD_CONSENT, APPLY_HOLD, HOLD_CLOSE, HOLD_DECLINED_CLOSE]
  later:
    title: 5. Call back or hand over
    about: The customer is busy or wants a person. Note when to call back, or ask a senior to call.
    states: [RECALL, APPLY_RECALL, RECALL_CLOSE, ESCALATE_RM, RM_CLOSE]
  anytime:
    title: 6. Can happen any time
    about: Someone else answers, there is no solar plant at this home, the customer asks us not to call, or nobody replies.
    states: [WRONG_PERSON, WRONG_NUMBER_CLOSE, NO_PLANT_CLOSE, DNC_CLOSE, SENSITIVE_CLOSE, NO_ANSWER_CLOSE]

# Plain-English labels for diagram arrows (events and guard flags).
labels:
  context_ready: OK to call
  not_eligible: Can't call now
  silence_timeout: No reply
  action_ok: Done
  action_failed: System error
  band_available: Free
  band_full: Full
  no_backup_slots: No other days
  slot_found: Found one
  none_found: None free
  exact_time_limit_reached: {when_true: asks again, when_false: first time}
  options_remaining: {when_true: more days to offer, when_false: no more days}
  reschedule_after_ready_date: {when_true: if rebooking is on, when_false: default}
  date_is_free: {when_true: Beat Plan has that day, when_false: not in Beat Plan}
  readiness_done: {when_true: already checked, when_false: first time}

# Example values for {placeholders}, so the shareable page shows a real-sounding line.
sample_values:
  hi: {name: राहुल, bot_name: Krupal, weekday: शनिवार, date_spoken: 28 नवंबर, band_spoken: सुबह आठ से बारह बजे, bands_spoken: "सुबह नौ से बारह बजे या शाम तीन से छह बजे",
       options_spoken: "सोमवार, 30 नवंबर, सुबह या बुधवार, 2 दिसंबर, शाम", missing_item: A-type ladder,
       hold_until_spoken: 5 दिसंबर, recall_window_spoken: कल शाम 5 से 7 बजे,
       requested_date_spoken: "गुरुवार, 10 दिसंबर", requested_band_spoken: सुबह, sms_line: "", issue_line: ""}
  en: {name: Rahul, bot_name: Krupal, weekday: Saturday, date_spoken: 28 November, band_spoken: 8 am and 12 pm, bands_spoken: "the morning (9 am to 12 pm) or the evening (3 pm to 6 pm)",
       options_spoken: "Monday, 30 November, morning or Wednesday, 2 December, evening", missing_item: A-type ladder,
       hold_until_spoken: 5 December, recall_window_spoken: tomorrow 5 to 7 pm,
       requested_date_spoken: "Thursday, 10 December", requested_band_spoken: morning, sms_line: "", issue_line: ""}

# Events raised by code (timers, action results), not by the customer.
events:
  - context_ready
  - not_eligible
  - silence_timeout
  - action_ok
  - action_failed
  - band_available
  - band_full
  - no_backup_slots
  - slot_found
  - none_found

# Flags code computes before choosing a guarded transition.
flags:
  exact_time_limit_reached: "exact_time_asks (including this one) > policies.exact_time_insist_limit"
  options_remaining: "unoffered backup slots exist"
  reschedule_after_ready_date: "policies.on_missing_prereq == 'reschedule_after_ready_date'"
  date_is_free: "the date the customer suggested is the planned date or a Beat Plan backup day"
  readiness_done: "every readiness item (ladder, water, light) was already answered in this call"

# Applies to every conversation state.
global_events:
  - on: silence_timeout
    to: NO_ANSWER_CLOSE

outcomes:
  - slot_confirmed
  - slot_confirmed_alt_band
  - slot_confirmed_alt_day
  - site_on_hold
  - hold_declined
  - no_slot_available
  - rm_callback
  - recall_requested
  - do_not_call
  - wrong_number
  - no_solar_plant
  - no_answer
  - needs_manual_confirmation
  - not_dialled
  - not_needed_now
  - date_requested

# Runs after every terminal state, whatever the outcome.
post_call:
  actions: [summarise_call, post_beatplan_comment]

states:

  PRE_CALL:
    title: Check before calling
    type: system
    actions: [fetch_beatplan_context, check_call_eligibility]
    transitions:
      - on: context_ready
        to: GREET
      - on: not_eligible
        to: NOT_DIALLED

  GREET:
    title: Say hello, check it's the customer
    type: conversation
    collects: [identity_confirmed]
    transitions:
      - on: affirm
        to: OFFER_PRIMARY
        set: {spoke_to: customer}
      - on: deny
        to: WRONG_PERSON
      - on: household_member            # "I'm his brother, go ahead": no need to ask again
        to: OFFER_PRIMARY
        set: {spoke_to: family_member}

  WRONG_PERSON:
    title: Someone else answered
    type: conversation
    disable_global: [wrong_person]      # "it's not them" again here means a wrong number, not another round of the question
    transitions:
      - on: wrong_person
        to: WRONG_NUMBER_CLOSE
      - on: affirm
        to: OFFER_PRIMARY
        set: {spoke_to: family_member}
      - on: household_member
        to: OFFER_PRIMARY
        set: {spoke_to: family_member}
      - on: customer_unavailable
        to: RECALL
      - on: deny
        to: WRONG_NUMBER_CLOSE

  OFFER_PRIMARY:
    title: Offer the planned date
    type: conversation
    disable_global: [ask_time]          # here "what time?" moves on to TIME_BAND
    transitions:
      - on: affirm
        to: ASK_SLOT                    # date agreed: now ask which time suits them
        set: {selected_slot: primary_slot, slot_source: primary}
      - on: ask_time
        to: TIME_BAND
      - on: wants_exact_time
        to: TIME_BAND
        say: no_exact_guarantee
      - on: wants_other_band
        to: CHECK_BAND
      - on: asks_other_slots            # "koi aur slot hai?": offer the other days right away
        to: ALTERNATE_DAYS
      - on: deny
        to: ALTERNATE_DAYS
      - on: proposes_date
        when: date_is_free
        to: ASK_SLOT
        set: {slot_source: alt_day}
      - on: proposes_date
        when: "!date_is_free"
        to: ASK_BAND_FOR_DATE

  ASK_SLOT:
    title: Ask which time suits
    type: conversation
    shares_time: true                   # from here on the read-back and close say the time window
    # Offers only the bands still free that day (Beat Plan availability); one free band -> prompt key one_band.
    # "Any time is fine" / "yes" keeps the planned band. A clock time ("11 baje") is read as its band.
    collects: [preferred_band]
    disable_global: [ask_time]          # "kitne baje?" here: just ask the question again
    transitions:
      - on: gives_band
        to: CHECK_SLOT
      - on: wants_other_band
        to: CHECK_SLOT
      - on: affirm                      # only reached before the readiness check, so no readiness_done branch
        to: READINESS_CHECK
      - on: dont_know
        to: READINESS_CHECK
      - on: ask_time
        to: ASK_SLOT
      - on: wants_exact_time
        when: "!exact_time_limit_reached"
        to: ASK_SLOT
        say: no_exact_guarantee
      - on: wants_exact_time
        when: exact_time_limit_reached
        to: ESCALATE_RM
        set: {rm_callback_reason: insists_on_exact_time}
      - on: asks_other_slots            # "koi aur din hai?" instead of a time: offer the other days
        to: ALTERNATE_DAYS
      - on: deny
        to: ALTERNATE_DAYS
      - on: proposes_date
        when: date_is_free
        to: ASK_SLOT
        set: {slot_source: alt_day}
      - on: proposes_date
        when: "!date_is_free"
        to: ASK_BAND_FOR_DATE

  CHECK_SLOT:
    title: Check the time they picked
    type: system
    actions: [check_band_availability]
    transitions:
      - on: band_available
        to: READINESS_CHECK
      - on: band_full
        to: ASK_SLOT
        say: band_full

  TIME_BAND:
    title: Tell the time window
    type: conversation
    collects: [preferred_exact_time]
    transitions:
      - on: affirm
        when: readiness_done            # changing the time from the recap: keep the chosen day
        to: RECAP
      - on: affirm
        to: READINESS_CHECK
        set: {selected_slot: primary_slot, slot_source: primary}
      - on: wants_exact_time
        when: "!exact_time_limit_reached"
        to: TIME_BAND
        say: no_exact_guarantee
      - on: wants_exact_time
        when: exact_time_limit_reached
        to: ESCALATE_RM
        set: {rm_callback_reason: insists_on_exact_time}
      - on: wants_other_band
        to: CHECK_BAND
      - on: asks_other_slots
        to: ALTERNATE_DAYS
      - on: deny
        to: ALTERNATE_DAYS

  CHECK_BAND:
    title: Check another time that day
    type: system
    actions: [check_band_availability]
    transitions:
      - on: band_available
        when: readiness_done
        to: RECAP
        set: {slot_source: alt_band}
      - on: band_available
        to: READINESS_CHECK
        set: {slot_source: alt_band}
      - on: band_full
        to: ALTERNATE_DAYS
        say: band_full

  ALTERNATE_DAYS:
    title: Offer other days
    type: conversation
    actions: [get_backup_slots]          # sorted closest-first, offered max_options_per_turn at a time
    # A "no" to the time of a day they picked rolls back here: the other days offered with it come back,
    # the rejected day does not. With no day left, they are asked for a date of their own.
    transitions:
      - on: no_backup_slots
        to: ASK_OWN_DATE
      - on: affirm
        when: readiness_done            # changing the day from the recap: no second checklist
        to: RECAP
        set: {slot_source: alt_day}
      - on: affirm
        to: ASK_SLOT
        set: {slot_source: alt_day}
      - on: wants_other_band
        to: CHECK_BAND
      - on: proposes_date
        when: "!date_is_free"
        to: ASK_BAND_FOR_DATE
      - on: proposes_date
        when: readiness_done
        to: RECAP
        set: {slot_source: alt_day}
      - on: proposes_date
        to: ASK_SLOT
        set: {slot_source: alt_day}
      - on: asks_other_slots            # asking for more after the options were read out
        when: options_remaining
        to: ALTERNATE_DAYS
        say: next_options
      - on: asks_other_slots
        when: "!options_remaining"
        to: ASK_OWN_DATE                 # same as a "no" with no day left: ask theirs before giving up
      - on: deny
        when: options_remaining
        to: ALTERNATE_DAYS
        say: next_options
      - on: deny
        when: "!options_remaining"
        to: ASK_OWN_DATE                 # none of our days suit: ask theirs before giving up

  ASK_OWN_DATE:
    title: Ask which date suits them
    type: conversation
    # Reached when no Beat Plan day is left to offer (none in Beat Plan, a no to every day, or to the time of the last one).
    transitions:
      - on: proposes_date
        when: date_is_free
        to: ASK_SLOT
        set: {slot_source: alt_day}
      - on: proposes_date
        when: "!date_is_free"
        to: ASK_BAND_FOR_DATE
      - on: deny
        to: NO_SLOT_CLOSE
      - on: dont_know
        to: NO_SLOT_CLOSE

  NOT_NEEDED:
    title: Explain why the visit helps now
    type: conversation
    # Entered from the global not_needed_now intent ("plan is new", "panels are clean"). One try only.
    disable_global: [not_needed_now, ask_time]
    transitions:
      - on: affirm
        to: ASK_SLOT
        set: {selected_slot: primary_slot, slot_source: primary}
      - on: ask_time
        to: TIME_BAND
      - on: deny
        to: NOT_NEEDED_CLOSE
      - on: change_date                  # "visit नहीं करनी … date change करना है" (CALL-5d90b5f3)
        to: ALTERNATE_DAYS
      - on: change_time
        to: ASK_SLOT

  ASK_BAND_FOR_DATE:
    title: Ask the time for their date
    type: conversation
    collects: [requested_band]
    transitions:
      - on: gives_band
        to: REQUEST_CLOSE
      - on: dont_know
        to: REQUEST_CLOSE

  READINESS_CHECK:
    title: "Ask: ladder, water, light ready?"
    type: conversation
    # Asks every policies.readiness_items entry one at a time (prompt key ask_<id>).
    # `affirm` fires once all are yes; `deny` fires after the last answer if any was no.
    checklist: readiness_items
    collects: [readiness]
    transitions:
      - on: affirm
        to: RECAP
      - on: deny
        to: ASK_READY_DATE
        set: {hold_reason: prerequisites_missing}
      - on: unsure                       # "maybe": asked once whether they will have it by the visit
        to: READINESS_CHECK
      - on: dont_know
        to: READINESS_CHECK
      # "time slot change करना है" / "visit का date change करना है" mid-checklist (CALL-5d90b5f3): the LLM read
      # them right but this step had no branch, so the bot said "ठीक से सुनाई नहीं दिया". Answers so far are kept.
      - on: change_date
        to: ALTERNATE_DAYS
      - on: change_time
        to: ASK_SLOT
      - on: wants_other_band
        to: CHECK_BAND

  ASK_READY_DATE:
    title: Ask when it will be ready
    type: conversation
    collects: [hold_until]
    transitions:
      - on: date_given
        when: reschedule_after_ready_date
        to: FIND_SLOT_AFTER_READY
      - on: date_given
        when: "!reschedule_after_ready_date"
        to: HOLD_CONSENT
      - on: dont_know
        to: ESCALATE_RM
        set: {rm_callback_reason: customer_unsure}
      - on: cannot_arrange               # "light का connection नहीं arrange हो पाएगा" (CALL-6517ea26): no date to hold for
        to: ESCALATE_RM
        set: {rm_callback_reason: prerequisite_unavailable}

  FIND_SLOT_AFTER_READY:
    title: Find a free day after that
    type: system
    actions: [get_backup_slots]          # filtered to dates after hold_until
    transitions:
      - on: slot_found
        to: RECAP
        set: {slot_source: alt_day}
      - on: none_found
        to: HOLD_CONSENT

  RECAP:
    time_line: with_time    # say the time window once it was talked about (always after ASK_SLOT)
    title: Repeat the details, get a yes
    type: conversation
    transitions:
      - on: affirm
        to: SITE_ISSUES                  # one last question, then book
      - on: deny
        to: RECAP_CHANGE
      - on: corrects_readiness           # "actually I have no ladder": the checklist re-runs with the corrected answer
        to: READINESS_CHECK
      - on: change_date
        to: ALTERNATE_DAYS
      - on: change_time
        to: TIME_BAND

  RECAP_CHANGE:
    title: Ask what to change
    type: conversation
    transitions:
      - on: corrects_readiness
        to: READINESS_CHECK
      - on: change_date
        to: ALTERNATE_DAYS
      - on: change_time
        to: TIME_BAND
      - on: wants_other_band
        to: CHECK_BAND
      - on: proposes_date
        when: "!date_is_free"
        to: ASK_BAND_FOR_DATE
      - on: proposes_date
        to: RECAP
        set: {slot_source: alt_day}

  SITE_ISSUES:
    title: Ask about any issue on the site
    type: conversation
    # Last question before booking: rusting, cracks, leaks... What they say is saved as `site_issues` (call record,
    # Beat Plan comment and the confirm_slot call) so the team can look at it during the visit.
    collects: [site_issues]
    transitions:
      - on: reports_issue
        to: BOOK
      - on: affirm                       # "yes, there is a problem" without saying which
        to: ISSUE_DETAILS
      - on: deny
        to: BOOK
      - on: dont_know
        to: BOOK

  ISSUE_DETAILS:
    title: Ask which issue
    type: conversation
    collects: [site_issues]
    transitions:
      - on: reports_issue
        to: BOOK
      - on: affirm
        to: BOOK
      - on: deny
        to: BOOK
      - on: dont_know
        to: BOOK

  BOOK:
    title: Book the visit
    type: system
    actions: [confirm_slot]
    transitions:
      - on: action_ok
        to: CONFIRMED_CLOSE
      - on: action_failed
        to: MANUAL_CONFIRM_CLOSE

  SITE_ON_HOLD:
    title: Ask when we can come
    type: conversation
    # Entered from the global not_serviceable intent (out of town, roof repair...).
    collects: [hold_reason, hold_until]
    disable_global: [not_serviceable]
    transitions:
      - on: date_given
        to: HOLD_CONSENT
      - on: dont_know
        to: ESCALATE_RM
        set: {rm_callback_reason: customer_unsure}

  HOLD_CONSENT:
    title: Ask OK to pause calls
    type: conversation
    disable_global: [not_serviceable]
    transitions:
      - on: affirm
        to: APPLY_HOLD
        set: {hold_consent: true}
      - on: deny
        to: HOLD_DECLINED_CLOSE
        set: {hold_consent: false}
      # "haan, Monday ko karwa lo": a day to visit, not a yes to the pause. Same branches as ALTERNATE_DAYS.
      - on: proposes_date
        when: "!date_is_free"
        to: ASK_BAND_FOR_DATE
      - on: proposes_date
        when: readiness_done
        to: RECAP
        set: {slot_source: alt_day}
      - on: proposes_date
        to: ASK_SLOT
        set: {slot_source: alt_day}

  APPLY_HOLD:
    title: Pause the site
    type: system
    actions: [site_on_hold]
    transitions:
      - on: action_ok
        to: HOLD_CLOSE
      - on: action_failed
        to: MANUAL_CONFIRM_CLOSE

  RECALL:
    title: Ask when to call back
    type: conversation
    collects: [recall_window]
    disable_global: [call_later]
    transitions:
      - on: time_range_given
        to: APPLY_RECALL
      - on: dont_know
        to: ESCALATE_RM
        set: {rm_callback_reason: customer_unsure}

  APPLY_RECALL:
    title: Note the call-back time
    type: system
    actions: [schedule_recall]
    transitions:
      - on: action_ok
        to: RECALL_CLOSE
      - on: action_failed
        to: MANUAL_CONFIRM_CLOSE      # never say "we will call you" when saving it failed

  ESCALATE_RM:
    title: Ask a senior to call
    type: system
    actions: [create_rm_callback]
    transitions:
      - on: action_ok
        to: RM_CLOSE
      - on: action_failed
        to: MANUAL_CONFIRM_CLOSE      # never say "we will call you" when saving it failed

  # ---------- terminal states (each ends the call with one outcome) ----------

  CONFIRMED_CLOSE:
    title: Visit booked
    type: terminal
    time_line: with_time    # say the time window once it was talked about (always after ASK_SLOT)
    outcome_from: slot_source
    outcome_map:
      primary: slot_confirmed
      alt_band: slot_confirmed_alt_band
      alt_day: slot_confirmed_alt_day

  SENSITIVE_CLOSE:
    title: Kind goodbye, calls paused
    type: terminal
    # Death / accident / emergency, or an upset customer: say sorry, end the call, ask nothing and no date.
    actions: [site_on_hold]
    outcome: site_on_hold

  HOLD_CLOSE:
    title: Site paused
    type: terminal
    outcome: site_on_hold

  HOLD_DECLINED_CLOSE:
    title: Customer said no to pausing
    type: terminal
    outcome: hold_declined

  NO_SLOT_CLOSE:
    title: No free slot
    type: terminal
    outcome: no_slot_available

  RM_CLOSE:
    title: Senior will call
    type: terminal
    outcome: rm_callback

  RECALL_CLOSE:
    title: We'll call back
    type: terminal
    outcome: recall_requested

  DNC_CLOSE:
    title: Won't call again
    type: terminal
    actions: [mark_dnc]
    outcome: do_not_call

  WRONG_NUMBER_CLOSE:
    title: Wrong number
    type: terminal
    outcome: wrong_number

  NO_PLANT_CLOSE:
    title: No solar plant here
    type: terminal
    outcome: no_solar_plant              # Beat Plan comment flags the site / number mapping for ops to check

  NO_ANSWER_CLOSE:
    title: No answer
    type: terminal
    outcome: no_answer

  MANUAL_CONFIRM_CLOSE:
    title: Team will confirm
    type: terminal
    actions: [create_rm_callback]
    outcome: needs_manual_confirmation

  NOT_NEEDED_CLOSE:
    title: Not needed yet, call later
    type: terminal
    outcome: not_needed_now

  REQUEST_CLOSE:
    title: Date request noted
    type: terminal
    actions: [request_date]
    outcome: date_requested

  NOT_DIALLED:
    title: Not called
    type: terminal
    silent: true                         # call never placed; still logged to Beat Plan
    outcome: not_dialled
