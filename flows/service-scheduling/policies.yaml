# Tunable business rules. Change values here; no code change needed.

persona:
  name: Krupal              # fallback; the bot uses the active cloned voice's name when one is set (/voice page)
  gender: male              # drives Hindi verb forms in prompts (karti hoon / karta hoon)

languages: [hi, en]         # every conversation/terminal state needs a line in prompts/<lang>.yaml
default_language: hi        # switch to en if the customer speaks mostly English

# ~4-hour bands we commit to. We never commit to an exact time.
time_bands:
  morning:   {start: "09:00", end: "12:00"}
  afternoon: {start: "12:00", end: "15:00"}
  evening:   {start: "15:00", end: "18:00"}
service_hours: {start: "09:00", end: "18:00"}   # asked for a time outside this -> say the hours, ask again

max_options_per_turn: 2       # never read more than 2 alternate slots in one turn
exact_time_insist_limit: 1    # repeat "can't guarantee" this many times, then escalate to RM
backup_slot_order: closest_first

# What the customer must have ready for the Service Hero. Asked one at a time.
readiness_items:
  - id: ladder
    labels: {en: A-type ladder, hi: A-type ladder}
    ask_if_can_arrange: true     # on "no", first ask "can you arrange one before the visit?"
  - id: water
    labels: {en: water source, hi: पानी का source}
  - id: light
    labels: {en: light connection, hi: light का connection}

# What to do when a readiness item is missing:
#   site_on_hold                -> ask ready-by date, put site on hold (current spec)
#   reschedule_after_ready_date -> first try a Beat Plan backup slot after that date
on_missing_prereq: site_on_hold

site_on_hold:
  max_hold_days: 90           # cap on hold_until; longer -> RM callback
  require_explicit_consent: true

# Say "you'll get a reminder SMS" when a visit is booked. Turn on only once Beat Plan really sends it.
sms_reminder: false

# Helpline the bot gives to upset customers. Spoken digit by digit, slowly, and the bot checks it was noted.
support_number: "9830003000"
# Spoken visit length for "how long will it take?", e.g. "45 minute". Empty = not mentioned.
visit_duration: ""
# Don't call a site more often than this (customers complained about repeated calls).
call_limits: {min_hours_between_calls: 24, max_calls_per_week: 3}
# Earliest visit is this many days ahead ("aaj aa jao" gets the nearest day instead).
min_notice_days: 1

# ---------------------------------------------------------------------------------------------
# Voice delivery. Sarvam bulbul:v4-flash takes pace (0.5-2.0), pitch (-0.75..0.75) and loudness per line.
# tones = how the bot sounds; moods = what the customer's mood (as the LLM reads it) switches on.
# A state's own `tone:` in flow.yaml wins over the mood (e.g. reading out the helpline is always slow).
tones:
  warm:       {pace: 1.0,  pitch: 0.0,   loudness: 1.0}    # default: friendly, normal speed
  brisk:      {pace: 1.12, pitch: 0.0,   loudness: 1.0}    # busy customer: get to the point
  slow_clear: {pace: 0.85, pitch: 0.0,   loudness: 1.1}    # confused / elderly / numbers and dates
  empathetic: {pace: 0.88, pitch: -0.1,  loudness: 0.95}   # annoyed or angry: slower, lower, softer
  calm_firm:  {pace: 0.9,  pitch: -0.15, loudness: 1.0}    # abusive: steady, never louder or faster
moods:
  calm:     {tone: warm}
  busy:     {tone: brisk, short_lines: true}               # short form of each question (repeat_<key>)
  confused: {tone: slow_clear, short_lines: true}
  annoyed:  {tone: empathetic, acknowledge: true}          # "I understand." before the next line, once per step
  angry:    {tone: empathetic, acknowledge: true}
  abusive:  {tone: calm_firm}

calling_hours: {start: "09:00", end: "20:00", timezone: Asia/Kolkata}

silence:
  reprompt_after_s: 5
  max_reprompts: 2            # then silence_timeout -> NO_ANSWER_CLOSE

retries_per_question: 2       # misunderstood twice on the same step -> yes/no fallback, then RM

compliance:
  recording_disclosure: true
  test_numbers_only: true     # hackathon rule: dial only ALLOWED_TEST_NUMBERS
  never_promise: [price, savings, generation, subsidy]
