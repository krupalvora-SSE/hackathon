  repeat_main: "आपको किस time call करूँ?"

SITE_ISSUES:
  main: "ठीक है। आख़िरी बात, क्या आपकी site पर कोई problem है जो आप हमें बताना चाहेंगे, जैसे जंग लगना या कोई टूट-फूट?"
  repeat_main: "क्या site पर कोई problem है, जैसे जंग?"

ISSUE_DETAILS:
  main: "कौन सी problem है, ज़रा बताइए?"
