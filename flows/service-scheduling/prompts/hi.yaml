CONFIRMED_CLOSE:
  main: "आपकी visit {weekday}, {date_spoken} के लिए confirm हो गई है।{sms_line} धन्यवाद, आपका दिन शुभ हो!"
  with_time: "आपकी visit {weekday}, {date_spoken}, {band_spoken} के बीच के लिए confirm हो गई है।{sms_line} धन्यवाद, आपका दिन शुभ हो!"
  main_family: "{name} जी की visit {weekday}, {date_spoken} के लिए confirm हो गई है।{sms_line} धन्यवाद, आपका दिन शुभ हो!"
  with_time_family: "{name} जी की visit {weekday}, {date_spoken}, {band_spoken} के बीच के लिए confirm हो गई है।{sms_line} धन्यवाद, आपका दिन शुभ हो!"

SENSITIVE_CLOSE:
  main: "ओह, यह जानकर बहुत दुख हुआ। हमारी संवेदनाएँ आपके और आपके परिवार के साथ हैं। हम आपको अभी परेशान नहीं करेंगे। कृपया अपना और परिवार का ध्यान रखिए।"
  apology: "माफ़ कीजिए, मेरा इरादा आपको परेशान करने का नहीं था। हम आपको अभी call नहीं करेंगे। कृपया अपना ध्यान रखिए।"

HOLD_CLOSE:
  main: "आपकी site {hold_until_spoken} तक hold पर है। उसके बाद हम आपसे संपर्क करेंगे। धन्यवाद!"

HOLD_DECLINED_CLOSE:
  main: "कोई बात नहीं, आपका समय देने के लिए धन्यवाद। आपका दिन शुभ हो!"

NO_SLOT_CLOSE:
  main: "माफ़ कीजिए, अभी हमारे पास और slots नहीं हैं। नया slot खुलते ही हमारी team आपसे संपर्क करेगी। धन्यवाद!"

RM_CLOSE:
  main: "मैं हमारे senior से आपको callback arrange करवा देता हूँ, वो जल्द ही आपसे बात करेंगे। धन्यवाद!"

RECALL_CLOSE:
  main: "ठीक है, हम आपको {recall_window_spoken} call करेंगे। धन्यवाद!"

DNC_CLOSE:
  main: "माफ़ कीजिए परेशानी के लिए। आपको आगे से call नहीं आएगी। धन्यवाद।"

WRONG_NUMBER_CLOSE:
