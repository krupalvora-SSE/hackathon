# Hindi (Hinglish) lines per state. Male persona (policies.persona).
# Devanagari for Hindi words, English nouns kept as people say them (see hindi-voice-scripting skill).
# Placeholders are filled by code, already spelled out in words:
#   {name} {bot_name} {date_spoken} {weekday} {band_spoken} {options_spoken}
#   {missing_item} {hold_until_spoken} {recall_window_spoken}
# `mai` is spoken on entering the state; other keys are used via `say:` in flow.yaml.
# After a _global line (deflection, didnt_catch, reprompt) the bot repeats the current question.
# Keep each line under ~20 words, one question per turn. The LLM may paraphrase lightly.

_global:
  deflection: "इसकी जानकारी हमारी टीम आपको अलग से देगी।"
  reprompt: "हैलो, क्या आप मुझे सुन पा रहे हैं?"
  sms_reminder: "Visit से पहले आपको reminder SMS भी आ जाएगा।"
  language_switched: "जी, ज़रूर।"
  only_hi_en: "माफ़ कीजिए, अभी मैं सिर्फ़ हिंदी या English में बात कर सकता हूँ। कौन सी भाषा ठीक रहेगी?"
  on_line: "जी, कोई बात नहीं, मैं line पर हूँ।"
  site_issue_noted: "समझ गया, मैंने यह note कर लिया है। हमारे hero visit पर इसे check करेंगे।"
  who_we_are: "मैं SolarSquare से बोल रहा हूँ, आपके solar AMC plan की maintenance visit के लिए।"
  i_am_ai: "जी, मैं SolarSquare का AI assistant हूँ। आप चाहें तो मैं team member से बात करवा देता हूँ।"
  visit_info: "Visit में panels की cleaning और system का health check होगा{visit_duration_spoken}।"
  someone_home: "जी, visit के समय घर पर किसी का होना ज़रूरी है ताकि hero छत तक जा सकें।"
  can_you_hear: "हैलो, क्या आपको मेरी आवाज़ आ रही है?"
  same_day: "आज की visit नहीं हो पाएगी, कम से कम एक दिन पहले book करनी होती है।"
  empathy_ack: "मैं समझ सकता हूँ।"
  service_hours: "हमारी visits सुबह 9 से शाम 6 बजे के बीच ही होती हैं।"
  didnt_catch: "माफ़ कीजिए, ठीक से सुनाई नहीं दिया।"
  repeat_lead: "जी, फिर से बता देता हूँ।"

GREET:
  main: "नमस्ते, क्या मेरी बात {name} जी से हो रही है? मैं {bot_name}, SolarSquare से बोल रहा हूँ। यह कॉल रिकॉर्ड की जा रही है।"
  repeat_main: "जी, क्या मैं {name} जी से बात कर रहा हूँ?"

WRONG_PERSON:
  main: "कोई बात नहीं। क्या आप {name} जी के घर से बोल रहे हैं?"
  repeat_main: "क्या यह {name} जी का घर है?"

OFFER_PRIMARY:
  missed_visit: "पहले तो पिछली visit न हो पाने के लिए माफ़ी चाहता हूँ।"
  main: "{name} जी, आपके solar system का maintenance due है। {weekday}, {date_spoken} को हमारे पास slot है, क्या आप उस दिन available रहेंगे?"
  repeat_main: "{weekday}, {date_spoken} को आप available हैं?"

TIME_BAND:
  main: "उस दिन हमारे service hero {band_spoken} के बीच आएँगे। क्या यह time आपको ठीक लगेगा?"
  no_exact_guarantee: "Exact time की guarantee तो नहीं दे सकती, पर पूरी कोशिश करेंगे कि hero आपके बताए time पर ही आए। {band_spoken} चलेगा?"
  repeat_main: "{band_spoken} के बीच hero आएँगे, चलेगा?"
  repeat_no_exact_guarantee: "{band_spoken} के बीच आना ठीक रहेगा?"

ALTERNATE_DAYS:
  main: "कोई बात नहीं। {options_spoken} में से कोई दिन आपको ठीक रहेगा?"
  band_full: "माफ़ कीजिए, उस दिन वह time slot खाली नहीं है। {options_spoken} में से कोई दिन चलेगा?"
  next_options: "अच्छा, तो {options_spoken} कैसा रहेगा?"
  repeat_main: "{options_spoken}, इनमें से कौन सा दिन ठीक रहेगा?"
  repeat_band_full: "{options_spoken}, इनमें से कौन सा दिन ठीक रहेगा?"
  repeat_next_options: "{options_spoken}, इनमें से कौन सा दिन ठीक रहेगा?"

NOT_NEEDED:
  main: "जी, आपकी बात सही है कि plan अभी नया है। इसीलिए पहली visit एक check-up की तरह होती है, ताकि कोई भी problem शुरू में ही पकड़ में आ जाए। तो क्या मैं {weekday}, {date_spoken} का slot book कर दूँ?"

ASK_BAND_FOR_DATE:
  main: "ठीक है। {requested_date_spoken} को सुबह, दोपहर या शाम, कौन सा time आपके लिए ठीक रहेगा?"

READINESS_CHECK:
  main: "बढ़िया। Service के लिए कुछ चीज़ें ready रखनी होंगी, बस confirm कर लेता हूँ।"
  ask_ladder: "क्या आपके पास A-type ladder है, जिससे hero छत तक पहुँच सकें?"
  not_required_ack: "ठीक है, note कर लिया।"
  repeat_arrange_ladder: "क्या visit से पहले A-type ladder का इंतज़ाम हो पाएगा?"
  arrange_ladder: "कोई बात नहीं। क्या visit से पहले आप कहीं से A-type ladder arrange कर पाएँगे?"
  ask_water: "Panels के पास पानी का source है?"
  ask_light: "और वहाँ light का connection है?"
  repeat_ask_ladder: "आपके पास A-type ladder है?"
  repeat_ask_water: "Panels के पास पानी मिल जाएगा?"
  repeat_ask_light: "वहाँ light का connection है?"

ASK_READY_DATE:
  main: "समझ गया। {missing_item} कब तक arrange हो जाएगा, कोई date बता सकते हैं?"
  repeat_main: "{missing_item} किस date तक हो जाएगा?"

RECAP:
  main: "तो {weekday}, {date_spoken}, और ladder, पानी और light ready रहेंगे। मैं यह confirm कर दूँ?"
  with_time: "तो {weekday}, {date_spoken}, {band_spoken} के बीच, और ladder, पानी और light ready रहेंगे। मैं यह confirm कर दूँ?"
  repeat_main: "{weekday}, {date_spoken}। मैं यह confirm कर दूँ?"
  repeat_with_time: "{weekday}, {date_spoken}, {band_spoken}। मैं यह confirm कर दूँ?"

SITE_ON_HOLD:
  main: "समझ गया। आपकी site किस date से service के लिए ready होगी?"
  repeat_main: "आपकी site किस date से ready होगी?"

HOLD_CONSENT:
  main: "ठीक है, हम आपकी site {hold_until_spoken} तक hold पर रख देंगे। तब तक SolarSquare से आपको service के लिए call नहीं आएगी। क्या यह ठीक है?"
  repeat_main: "{hold_until_spoken} तक site hold पर रखूँ, ठीक है?"

RECALL:
  main: "जी बिल्कुल। आपको किस time पर call करना ठीक रहेगा?"
  repeat_main: "आपको किस time call करूँ?"

CONFIRMED_CLOSE:
  main: "आपकी visit {weekday}, {date_spoken} के लिए confirm हो गई है।{sms_line} धन्यवाद, आपका दिन शुभ हो!"
  with_time: "आपकी visit {weekday}, {date_spoken}, {band_spoken} के बीच के लिए confirm हो गई है।{sms_line} धन्यवाद, आपका दिन शुभ हो!"

HOLD_CLOSE:
  main: "आपकी site {hold_until_spoken} तक hold पर है। उसके बाद हम आपसे संपर्क करेंगे। धन्यवाद!"

HOLD_DECLINED_CLOSE:
  main: "कोई बात नहीं, आपका समय देने के लिए धन्यवाद। आपका दिन शुभ हो!"

NO_SLOT_CLOSE:
  main: "माफ़ कीजिए, अभी हमारे पास और slots नहीं हैं। नया slot खुलते ही हमारी team आपसे संपर्क करेगी। धन्यवाद!"

RM_CLOSE:
  main: "इसके लिए मैं हमारे supervisor से आपको call arrange करवा देता हूँ, वो जल्द ही आपसे बात करेंगे। धन्यवाद!"

RECALL_CLOSE:
  main: "ठीक है, हम आपको {recall_window_spoken} call करेंगे। धन्यवाद!"

DNC_CLOSE:
  main: "माफ़ कीजिए परेशानी के लिए। आपको आगे से call नहीं आएगी। धन्यवाद।"

WRONG_NUMBER_CLOSE:
  main: "माफ़ कीजिए, शायद number गलत लग गया। आपका दिन शुभ हो।"

NO_ANSWER_CLOSE:
  main: "लगता है आवाज़ नहीं आ रही, हम आपको दोबारा call करेंगे। धन्यवाद।"

MANUAL_CONFIRM_CLOSE:
  main: "आपकी details note कर ली हैं, हमारी team जल्द ही confirm करके बताएगी। धन्यवाद!"

NOT_NEEDED_CLOSE:
  main: "ठीक है, कोई बात नहीं। हम कुछ समय बाद आपसे फिर संपर्क करेंगे। धन्यवाद!"

REQUEST_CLOSE:
  main: "मैंने आपकी {requested_date_spoken}, {requested_band_spoken} की request note कर ली है। यह date अभी fix नहीं है, technician की availability के हिसाब से बदल भी सकती है। हमारी team आपसे confirm कर लेगी। धन्यवाद!"

FRUSTRATED:
  main: "मैं समझ सकता हूँ, आपको परेशानी हुई, इसके लिए माफ़ी चाहता हूँ। मैंने आपके लिए support ticket बना दिया है, हमारी support team जल्द आपसे संपर्क करेगी। आप हमारी helpline पर भी बात कर सकते हैं, एक pen ले लीजिए। Number है: {support_number_spoken}। क्या आपने number note कर लिया?"
  repeat_main: "Helpline number है: {support_number_spoken}। Note कर लिया?"

AFTER_TICKET:
  main: "धन्यवाद। क्या तब तक मैं आपकी maintenance visit fix कर दूँ?"
  number_again: "कोई बात नहीं, मैं धीरे से फिर बोलता हूँ: {support_number_spoken}। एक बार और: {support_number_spoken}। क्या तब तक मैं आपकी maintenance visit fix कर दूँ?"
  repeat_main: "क्या visit fix कर दूँ?"
  repeat_number_again: "क्या visit fix कर दूँ?"

MISSED_VISIT:
  main: "पिछली बार कोई नहीं आ पाया, इसके लिए सच में माफ़ी चाहता हूँ, ऐसा नहीं होना चाहिए था। इस बार मैं आपकी visit पक्की करवा देता हूँ। क्या {weekday}, {date_spoken} आपके लिए ठीक रहेगा?"
  repeat_main: "क्या {weekday}, {date_spoken} ठीक रहेगा?"

TICKET_CLOSE:
  main: "ठीक है। आपका ticket बन गया है, हमारी support team आपसे संपर्क करेगी। Helpline फिर से: {support_number_spoken}। धन्यवाद।"

LINE_ISSUE_CLOSE:
  main: "लगता है आपको मेरी आवाज़ नहीं आ रही, हम थोड़ी देर में दोबारा call करेंगे। धन्यवाद।"
