# English lines per state. Same keys and placeholders as prompts/hi.yaml.

_global:
  opener: "Hello?"                 # first words of the call, before the customer speaks
  recall_as_told: "at the time you mentioned"   # call-back time we could not turn into words (RECALL_CLOSE)
  deflection: "Our team will share those details with you separately."
  reprompt: "Hello, can you hear me?"
  sms_reminder: "You'll also get a reminder SMS before the visit."
  service_hours: "Our visits happen only between 9 am and 6 pm."
  time_window: "Our service hero will come between {band_spoken} that day."
  didnt_catch: "Sorry, I didn't catch that."
  didnt_catch_date: "Sorry, I didn't get the date. For example 5 December, or in one month?"
  repeat_lead: "Sure, let me say that again."
  hold_ack: "Sure, I'm on the line, take your time."
  identity_who: "This is {bot_name} from SolarSquare, calling about your solar system maintenance."
  identity_source: "Your number is in SolarSquare's records for your solar system service."
  identity_robot: "Yes, I'm SolarSquare's AI voice assistant."
  empathy_personal: "Oh, I'm sorry to hear that, please take care."
  complaint_ack: "I'm sorry to hear that."
  language_not_supported: "I'm sorry, I don't understand this language. माफ़ कीजिए, मुझे यह भाषा समझ नहीं आती। Could you speak Hindi or English?"
  small_talk: "I'm doing well, thank you."
  not_a_visit_day: "Our visits are Monday to Saturday only."

GREET:
  main: "Hello, is this {name}? This is {bot_name} from SolarSquare."
  repeat_main: "Am I speaking with {name}?"

WRONG_PERSON:
  main: "No problem. Am I speaking with someone from {name}'s home?"
  repeat_main: "Is this {name}'s home?"

OFFER_PRIMARY:
  main: "{name}, your solar system maintenance is due. We have a slot on {weekday}, {date_spoken}. Will you be available that day?"
  repeat_main: "Are you free on {weekday}, {date_spoken}?"
  main_family: "{name}'s solar system maintenance is due. We have a slot on {weekday}, {date_spoken}. Will someone be home that day?"
  repeat_main_family: "Will someone be home on {weekday}, {date_spoken}?"

ASK_SLOT:
  main: "Which time suits you on {weekday}, {date_spoken}: {bands_spoken}?"
  one_band: "On {weekday}, {date_spoken} our service hero can come in {bands_spoken}. Does that time work for you?"
  band_full: "Sorry, that time is not free that day. {bands_spoken} is free, would that work?"
  no_exact_guarantee: "I can't guarantee an exact time, but we'll do our best. Which suits you: {bands_spoken}?"
  repeat_main: "{bands_spoken}, which time suits you?"
  repeat_one_band: "Is {bands_spoken} okay?"
  repeat_band_full: "Would {bands_spoken} work?"
  repeat_no_exact_guarantee: "{bands_spoken}, which time suits you?"

TIME_BAND:
  main: "Our service hero will come between {band_spoken} that day. Does that work for you?"
  no_exact_guarantee: "I can't guarantee an exact time, but we'll do our best to send the hero at your preferred time. Would a visit between {band_spoken} work?"
  repeat_main: "The hero will come between {band_spoken}. Is that okay?"
  repeat_no_exact_guarantee: "Does a visit between {band_spoken} work for you?"

ALTERNATE_DAYS:
  main: "No problem. Would {options_spoken} work for you?"
  band_full: "Sorry, that time slot isn't free on that day. Would {options_spoken} work instead?"
  next_options: "Okay, how about {options_spoken}?"
  repeat_main: "Which day works: {options_spoken}?"
  repeat_band_full: "Which day works: {options_spoken}?"
  repeat_next_options: "Which day works: {options_spoken}?"

NOT_NEEDED:
  main: "You're right, the plan is new. That's why the first visit works as a check-up, so any problem is caught early. Shall I book {weekday}, {date_spoken} for you?"
  repeat_main: "Will you be available that day?"

ASK_OWN_DATE:
  main: "No problem. Which date would suit you? For example 5th December, or next Monday."
  repeat_main: "Which date would suit you?"

ASK_BAND_FOR_DATE:
  main: "Sure. On {requested_date_spoken}, would morning, afternoon or evening suit you?"
  repeat_main: "Morning, afternoon or evening?"

READINESS_CHECK:
  main: "Great. A few things need to be ready for the service, let me quickly confirm."
  ask_ladder: "Do you have an A-type ladder so the hero can reach the roof?"
  arrange_ladder: "No problem. Could you arrange an A-type ladder before the visit?"
  repeat_arrange_ladder: "Can you arrange a ladder before the visit?"
  ask_water: "Is there a water source near the panels?"
  ask_light: "And is there a light connection there?"
  repeat_ask_ladder: "Do you have an A-type ladder?"
  repeat_ask_water: "Is there water near the panels?"
  repeat_ask_light: "Is there a light connection there?"
  arrange_water: "Okay. Will you be able to arrange water near the panels before the visit?"
  arrange_light: "Okay. Will you be able to arrange a light connection before the visit?"
  repeat_arrange_water: "Can you arrange water before the visit?"
  repeat_arrange_light: "Can you arrange a light connection?"
  explain_ladder: "An A-type ladder is a folding ladder shaped like the letter A that stands on its own; our hero uses it to reach the roof."
  explain_water: "We need water to clean the panels."
  explain_light: "We need a power connection for the work."

ASK_READY_DATE:
  main: "Understood. By when can the {missing_item} be arranged? Could you give me a date?"
  repeat_main: "By what date can the {missing_item} be ready?"

RECAP:
  main: "So that's {weekday}, {date_spoken}. {ready_note}. Shall I confirm it?"
  with_time: "So that's {weekday}, {date_spoken}, between {band_spoken}. {ready_note}. Shall I confirm it?"
  repeat_main: "{weekday}, {date_spoken}. Shall I confirm?"
  repeat_with_time: "{weekday}, {date_spoken}, between {band_spoken}. Shall I confirm?"

RECAP_CHANGE:
  main: "Okay, what would you like to change, the day or the time?"
  repeat_main: "The day or the time?"

SITE_ON_HOLD:
  main: "Understood. From which date will your site be ready for service?"
  repeat_main: "From which date will the site be ready?"

HOLD_CONSENT:
  main: "Okay, we'll put your site on hold until {hold_until_spoken}. Until then you won't get service calls from SolarSquare. Is that okay?"
  repeat_main: "Is it okay to hold your site until {hold_until_spoken}?"

RECALL:
  main: "Of course. What time would be good to call you back?"
  repeat_main: "What time should I call you back?"

CONFIRMED_CLOSE:
  main: "Your visit is confirmed for {weekday}, {date_spoken}.{sms_line} Thank you, have a great day!"
  with_time: "Your visit is confirmed for {weekday}, {date_spoken}, between {band_spoken}.{sms_line} Thank you, have a great day!"
  main_family: "{name}'s visit is confirmed for {weekday}, {date_spoken}.{sms_line} Thank you, have a great day!"
  with_time_family: "{name}'s visit is confirmed for {weekday}, {date_spoken}, between {band_spoken}.{sms_line} Thank you, have a great day!"

SENSITIVE_CLOSE:
  main: "I'm so sorry to hear that. Our thoughts are with you and your family. We won't trouble you now. Please take care of yourselves."
  apology: "I'm sorry, I didn't mean to trouble you. We won't call you for now. Please take care."

HOLD_CLOSE:
  main: "Your site is on hold until {hold_until_spoken}. We'll reach out after that. Thank you!"

HOLD_DECLINED_CLOSE:
  main: "No problem, thank you for your time. Have a great day!"

NO_SLOT_CLOSE:
  main: "Sorry, we don't have any other slots right now. Our team will reach out as soon as a new slot opens. Thank you!"

RM_CLOSE:
  main: "I'll arrange a callback from our senior, they'll speak with you soon. Thank you!"

RECALL_CLOSE:
  main: "Sure, we'll call you {recall_window_spoken}. Thank you!"

DNC_CLOSE:
  main: "Sorry for the trouble. You won't receive further calls. Thank you."

WRONG_NUMBER_CLOSE:
  main: "Sorry, I may have dialled the wrong number. Have a good day."

NO_ANSWER_CLOSE:
  main: "I can't seem to hear you, we'll call you back. Thank you."

MANUAL_CONFIRM_CLOSE:
  main: "I've noted your details, our team will confirm shortly. Thank you!"

NOT_NEEDED_CLOSE:
  main: "No problem. We'll get in touch again after some time. Thank you!"

REQUEST_CLOSE:
  main: "I've noted your request for {requested_date_spoken}, {requested_band_spoken}. The date isn't fixed yet and may change with technician availability. Our team will confirm with you. Thank you!"
