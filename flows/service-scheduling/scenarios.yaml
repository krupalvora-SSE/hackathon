- name: out of town, then asks for a free backup day at the hold question -> booked that day
  steps:
    - context_ready
    - affirm
    - not_serviceable
    - date_given
    - {on: proposes_date, flags: {date_is_free: true, readiness_done: false}}
    - affirm
    - affirm
    - affirm
    - action_ok
