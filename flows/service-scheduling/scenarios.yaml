- name: says maybe to a readiness question, then confirms
  steps: [context_ready, affirm, affirm, affirm, unsure, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: asks what an item means, then confirms
  steps: [context_ready, affirm, affirm, affirm, asks_meaning, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: corrects a readiness answer at the recap, then confirms
  steps: [context_ready, affirm, affirm, affirm, affirm, corrects_readiness, affirm, affirm, action_ok]
