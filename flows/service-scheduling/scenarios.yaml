- name: out of town, then asks for a day Beat Plan doesn't have at the hold question -> date request
  steps:
    - context_ready
    - affirm
    - not_serviceable
    - date_given
    - {on: proposes_date, flags: {date_is_free: false}}
    - gives_band
  expect: date_requested
