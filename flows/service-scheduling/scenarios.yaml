# Paper-test calls. flowcheck.py walks each one through flow.yaml and checks the outcome.
# Each step is what code/LLM would emit: an intent (affirm, ask_time, ...) or an event
# (context_ready, action_ok, ...). `flags` set guard flags for that step.
# Add a scenario whenever you add or change a branch.

- name: yes, everything ready
  steps: [context_ready, affirm, affirm, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: asks time, accepts the 4-hour band
  steps:
    - context_ready
    - affirm
    - ask_time
    - {on: affirm, flags: {readiness_done: false}}
    - affirm
    - affirm
    - action_ok
  expect: slot_confirmed

- name: insists on exact time -> RM callback
  steps:
    - context_ready
    - affirm
    - ask_time
    - {on: wants_exact_time, flags: {exact_time_limit_reached: false}}
    - {on: wants_exact_time, flags: {exact_time_limit_reached: true}}
    - action_ok
  expect: rm_callback

- name: other band same day is free
  steps:
    - context_ready
    - affirm
    - ask_time
    - wants_other_band
    - {on: band_available, flags: {readiness_done: false}}
    - affirm
    - affirm
    - action_ok
  expect: slot_confirmed_alt_band

- name: other band full -> picks an alternate day
  steps:
    - context_ready
    - affirm
    - ask_time
    - wants_other_band
    - band_full
    - {on: affirm, flags: {readiness_done: false}}
    - affirm                      # ASK_SLOT: any time is fine
    - affirm
    - affirm
    - action_ok
  expect: slot_confirmed_alt_day

- name: not available, no alternate day fits
  steps:
    - context_ready
    - affirm
    - deny
    - {on: deny, flags: {options_remaining: true}}
    - {on: deny, flags: {options_remaining: false}}
    - deny                               # ASK_OWN_DATE: no date of their own either
  expect: no_slot_available

- name: Beat Plan has no backup slots at all
  steps: [context_ready, affirm, deny, no_backup_slots, deny]   # asked for their own date, none
  expect: no_slot_available

- name: ladder missing -> site on hold with consent
  steps:
    - context_ready
    - affirm
    - affirm
    - affirm                      # ASK_SLOT: any time is fine
    - deny
    - {on: date_given, flags: {reschedule_after_ready_date: false}}
    - affirm
    - action_ok
  expect: site_on_hold

- name: ladder + water yes, light can never be arranged -> RM callback, no date loop (CALL-6517ea26)
  steps:
    - context_ready
    - affirm
    - affirm
    - affirm                      # ASK_SLOT: morning
    - deny                        # readiness checklist: ladder yes, water yes, light no
    - cannot_arrange              # ASK_READY_DATE: "नहीं arrange हो पाएगा"
    - action_ok
  expect: rm_callback

- name: ladder missing, policy reschedules after ready date
  steps:
    - context_ready
    - affirm
    - affirm
    - affirm                      # ASK_SLOT: any time is fine
    - deny
    - {on: date_given, flags: {reschedule_after_ready_date: true}}
    - slot_found
    - affirm
    - action_ok
  expect: slot_confirmed_alt_day

- name: out of town -> declines the hold
  steps: [context_ready, affirm, not_serviceable, date_given, deny]
  expect: hold_declined

- name: call me later -> recall (stub)
  steps: [context_ready, affirm, call_later, time_range_given, action_ok]
  expect: recall_requested

- name: asks for a human mid-call
  steps: [context_ready, affirm, ask_time, wants_human, action_ok]
  expect: rm_callback

- name: asks to repeat a question, then confirms
  steps: [context_ready, repeat_request, affirm, repeat_request, affirm, affirm, repeat_request, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: asks to hold on, comes back and confirms
  steps: [context_ready, affirm, wait_a_moment, affirm, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: asks who is calling, where the number came from and if it is a robot, then confirms
  steps: [context_ready, who_are_you, number_source, is_robot, affirm, affirm, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: price question, then confirms
  steps: [context_ready, affirm, price_or_offtopic, affirm, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: family member picks up and confirms
  steps: [context_ready, wrong_person, household_member, affirm, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: wrong number
  steps: [context_ready, wrong_person, deny]
  expect: wrong_number

- name: do not call
  steps: [context_ready, affirm, do_not_call]
  expect: do_not_call

- name: silence after pickup
  steps: [context_ready, silence_timeout]
  expect: no_answer

- name: blocked before dialling (dnc / hours / allowlist)
  steps: [not_eligible]
  expect: not_dialled

- name: confirm API fails
  steps: [context_ready, affirm, affirm, affirm, affirm, affirm, action_failed]
  expect: needs_manual_confirmation

- name: 'not needed yet, explained, then agrees'
  steps: [context_ready, affirm, not_needed_now, affirm, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: 'not needed yet, still says no'
  steps: [context_ready, affirm, not_needed_now, deny]
  expect: not_needed_now

- name: asks for a time outside 9 to 6, then accepts the band
  steps:
    - context_ready
    - affirm
    - ask_time
    - outside_service_hours
    - {on: affirm, flags: {readiness_done: false}}
    - affirm
    - affirm
    - action_ok
  expect: slot_confirmed

- name: suggests a day Beat Plan has
  steps:
    - context_ready
    - affirm
    - {on: proposes_date, flags: {date_is_free: true}}
    - affirm                      # ASK_SLOT: any time is fine
    - affirm
    - affirm
    - action_ok
  expect: slot_confirmed_alt_day

- name: suggests a day Beat Plan doesn't have -> request noted
  steps:
    - context_ready
    - affirm
    - {on: proposes_date, flags: {date_is_free: false}}
    - gives_band
  expect: date_requested

- name: recap says no, asks what to change, changes the time, keeps the chosen day
  steps:
    - context_ready
    - affirm
    - affirm
    - affirm                      # ASK_SLOT: any time is fine
    - affirm
    - deny
    - change_time
    - {on: affirm, flags: {readiness_done: true}}
    - affirm
    - action_ok
  expect: slot_confirmed

- name: recap says no, proposes a free date, then confirms
  steps:
    - context_ready
    - affirm
    - affirm
    - affirm                      # ASK_SLOT: any time is fine
    - affirm
    - deny
    - {on: proposes_date, flags: {date_is_free: true}}
    - affirm
    - action_ok
  expect: slot_confirmed_alt_day

- name: changes the day from the recap, no second checklist
  steps:
    - context_ready
    - affirm
    - affirm
    - affirm                      # ASK_SLOT: any time is fine
    - affirm
    - change_date
    - {on: affirm, flags: {readiness_done: true}}
    - affirm
    - action_ok
  expect: slot_confirmed_alt_day

- name: changes the time window from the recap, other band is free
  steps:
    - context_ready
    - affirm
    - affirm
    - affirm                      # ASK_SLOT: any time is fine
    - affirm
    - change_time
    - wants_other_band
    - {on: band_available, flags: {readiness_done: true}}
    - affirm
    - action_ok
  expect: slot_confirmed_alt_band

- name: says no to the greeting, someone else answers and says yes
  steps: [context_ready, deny, affirm, affirm, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: asks for another time of day straight at the offer
  steps:
    - context_ready
    - affirm
    - wants_other_band
    - {on: band_available, flags: {readiness_done: false}}
    - affirm
    - affirm
    - action_ok
  expect: slot_confirmed_alt_band

- name: asks for an exact time straight at the offer
  steps:
    - context_ready
    - affirm
    - wants_exact_time
    - {on: affirm, flags: {readiness_done: false}}
    - affirm
    - affirm
    - action_ok
  expect: slot_confirmed

- name: does not know when the ladder will be ready -> senior callback
  steps: [context_ready, affirm, affirm, affirm, deny, dont_know, action_ok]
  expect: rm_callback

- name: out of town and cannot say when -> senior callback
  steps: [context_ready, affirm, not_serviceable, dont_know, action_ok]
  expect: rm_callback

- name: busy and cannot say when to call back -> senior callback
  steps: [context_ready, wrong_person, customer_unavailable, dont_know, action_ok]
  expect: rm_callback

- name: suggests an unavailable date and does not know the time of day
  steps:
    - context_ready
    - affirm
    - {on: proposes_date, flags: {date_is_free: false}}
    - dont_know
  expect: date_requested

- name: asks the time while choosing another day, then confirms
  steps:
    - context_ready
    - affirm
    - deny
    - ask_time
    - {on: affirm, flags: {readiness_done: false}}
    - affirm                      # ASK_SLOT: any time is fine
    - affirm
    - affirm
    - action_ok
  expect: slot_confirmed_alt_day

- name: asks the time at the readiness question, then confirms
  steps: [context_ready, affirm, affirm, affirm, ask_time, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: asks the time at the recap, then confirms
  steps: [context_ready, affirm, affirm, affirm, affirm, ask_time, affirm, action_ok]
  expect: slot_confirmed

- name: call-back time could not be saved -> team will confirm
  steps: [context_ready, wrong_person, customer_unavailable, time_range_given, action_failed]
