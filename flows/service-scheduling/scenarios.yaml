- name: small talk, then confirms
  steps: [context_ready, affirm, small_talk, affirm, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: family member says go ahead at the greeting, then confirms
  steps: [context_ready, household_member, affirm, affirm, affirm, affirm, action_ok]
