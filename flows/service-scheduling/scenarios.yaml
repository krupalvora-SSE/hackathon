- name: death mentioned while asked when to call back -> condolence, call ends
  steps: [context_ready, affirm, personal_reason, sensitive_situation]
  expect: site_on_hold

- name: customer upset with the bot -> apology, call ends, calls paused
  steps: [context_ready, affirm, upset_customer]
  expect: site_on_hold


- name: picks a free time when asked
  steps: [context_ready, affirm, affirm, gives_band, band_available, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: picked time is full, takes the free one
  steps: [context_ready, affirm, affirm, gives_band, band_full, affirm, affirm, affirm, action_ok]
  expect: slot_confirmed

- name: no time works that day -> another day
  steps:
    - context_ready
    - affirm
    - affirm
    - deny                            # ASK_SLOT: no time suits that day
    - {on: affirm, flags: {readiness_done: false}}
    - affirm                          # ASK_SLOT: any time is fine
    - affirm
    - affirm
    - action_ok
